name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build LwX.Web.Testing.Viewer.slnx -c Release
      - run: pwsh build/pack.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-package
          path: artifacts/packages/*.nupkg
